<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — WanderLux</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
</head>
<body class="auth-body">

<!-- ===== CHECKPOINT 4: REGISTER PAGE ===== -->
<div class="auth-card register-card">
  <div class="auth-logo">✈️</div>
  <h1 class="auth-title">Create Your Account</h1>
  <p class="auth-sub">Join WanderLux and start exploring the world</p>

  <form id="registerForm" class="auth-form" novalidate>

    <!-- Full Name -->
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name" />
      <span class="error-msg" id="err-fullName"></span>
    </div>

    <!-- Contact Number -->
    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" placeholder="10-digit mobile number" maxlength="10" autocomplete="tel" />
      <span class="error-msg" id="err-contact"></span>
    </div>

    <!-- Date of Birth -->
    <div class="form-group">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" autocomplete="bday" />
      <span class="error-msg" id="err-dob"></span>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email ID</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
      <span class="error-msg" id="err-email"></span>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="Minimum 8 characters" autocomplete="new-password" />
        <button type="button" class="toggle-eye" id="togglePass" aria-label="Toggle password visibility">👁️</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <span class="strength-label" id="strengthLabel"></span>
      <span class="error-msg" id="err-password"></span>
    </div>

    <!-- Confirm Password -->
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
        <button type="button" class="toggle-eye" id="toggleConfirm" aria-label="Toggle confirm password visibility">👁️</button>
      </div>
      <span class="error-msg" id="err-confirmPassword"></span>
    </div>

    <!-- Gender -->
    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male" /> Male</label>
        <label><input type="radio" name="gender" value="Female" /> Female</label>
        <label><input type="radio" name="gender" value="Other" /> Other</label>
      </div>
      <span class="error-msg" id="err-gender"></span>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn-gold full-width" style="margin-top:0.5rem;">Register</button>
  </form>

  <hr class="auth-divider" />
  <p class="auth-link">Already have an account? <a href="login.html">Login here →</a></p>
</div>

<script>
  // ===== SET MAX DOB (must be 18+ years) =====
  window.addEventListener("DOMContentLoaded", () => {
    const today = new Date();
    const maxDob = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
    const maxStr = maxDob.toISOString().split("T")[0];
    document.getElementById("dob").max = maxStr;
    document.getElementById("dob").value = "";
  });

  // ===== PASSWORD STRENGTH METER =====
  document.getElementById("password").addEventListener("input", function () {
    const val = this.value;
    const fill = document.getElementById("strengthFill");
    const label = document.getElementById("strengthLabel");

    let score = 0;
    if (val.length >= 8)  score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    if (val.length === 0) {
      fill.style.width = "0%";
      fill.style.background = "transparent";
      label.textContent = "";
      label.className = "strength-label";
    } else if (score <= 1) {
      fill.style.width = "25%";
      fill.style.background = "#e05252";
      label.textContent = "Weak";
      label.className = "strength-label weak";
    } else if (score === 2 || score === 3) {
      fill.style.width = "60%";
      fill.style.background = "#f0a500";
      label.textContent = "Medium";
      label.className = "strength-label medium";
    } else {
      fill.style.width = "100%";
      fill.style.background = "#4caf50";
      label.textContent = "Strong";
      label.className = "strength-label strong";
    }
  });

  // ===== TOGGLE PASSWORD VISIBILITY =====
  document.getElementById("togglePass").addEventListener("click", function () {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
    this.textContent = input.type === "password" ? "👁️" : "🙈";
  });

  document.getElementById("toggleConfirm").addEventListener("click", function () {
    const input = document.getElementById("confirmPassword");
    input.type = input.type === "password" ? "text" : "password";
    this.textContent = input.type === "password" ? "👁️" : "🙈";
  });

  // ===== REGISTRATION FORM VALIDATION =====
  document.getElementById("registerForm").addEventListener("submit", function (e) {
    e.preventDefault();
    let valid = true;

    // Clear all errors
    document.querySelectorAll(".error-msg").forEach(el => el.textContent = "");

    const fullName = document.getElementById("fullName").value.trim();
    const contact  = document.getElementById("contact").value.trim();
    const dob      = document.getElementById("dob").value;
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm  = document.getElementById("confirmPassword").value;
    const gender   = document.querySelector('input[name="gender"]:checked');

    // --- Full Name ---
    if (!fullName) {
      document.getElementById("err-fullName").textContent = "Full name is required.";
      valid = false;
    } else if (fullName.length < 3) {
      document.getElementById("err-fullName").textContent = "Name must be at least 3 characters.";
      valid = false;
    }

    // --- Contact ---
    const contactRegex = /^\d{10}$/;
    if (!contact) {
      document.getElementById("err-contact").textContent = "Contact number is required.";
      valid = false;
    } else if (!contactRegex.test(contact)) {
      document.getElementById("err-contact").textContent = "Enter a valid 10-digit mobile number.";
      valid = false;
    }

    // --- Date of Birth (age >= 18) ---
    if (!dob) {
      document.getElementById("err-dob").textContent = "Date of birth is required.";
      valid = false;
    } else {
      const birthDate = new Date(dob);
      const today = new Date();
      const age18 = new Date(birthDate.getFullYear() + 18, birthDate.getMonth(), birthDate.getDate());
      if (today < age18) {
        document.getElementById("err-dob").textContent = "You must be at least 18 years old.";
        valid = false;
      }
    }

    // --- Email ---
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email) {
      document.getElementById("err-email").textContent = "Email address is required.";
      valid = false;
    } else if (!emailRegex.test(email)) {
      document.getElementById("err-email").textContent = "Please enter a valid email address.";
      valid = false;
    }

    // --- Password ---
    if (!password) {
      document.getElementById("err-password").textContent = "Password is required.";
      valid = false;
    } else if (password.length < 8) {
      document.getElementById("err-password").textContent = "Password must be at least 8 characters.";
      valid = false;
    }

    // --- Confirm Password ---
    if (!confirm) {
      document.getElementById("err-confirmPassword").textContent = "Please confirm your password.";
      valid = false;
    } else if (confirm !== password) {
      document.getElementById("err-confirmPassword").textContent = "Passwords do not match.";
      valid = false;
    }

    // --- Gender ---
    if (!gender) {
      document.getElementById("err-gender").textContent = "Please select your gender.";
      valid = false;
    }

    // --- SUCCESS ---
    if (valid) {
      alert("✅ Registration Successful! Welcome to WanderLux. Redirecting to login...");
      setTimeout(() => {
      window.location.href = "login.html";
      }, 1500);
    }
  });
</script>
</body>
</html>
